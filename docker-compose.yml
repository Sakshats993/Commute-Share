version: "3.9"

services:

  # ==========================================================
  # PostgreSQL Database
  # ==========================================================

  postgres:
    image: postgres:16

    container_name: commuteshare_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: commuteshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # Backend
  # ==========================================================

  backend:
    build:
      context: ./backend

    container_name: commuteshare_backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./backend/.env.example

    volumes:
      - ./backend:/app

    working_dir: /app

    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload

    ports:
      - "8000:8000"

  # ==========================================================
  # Frontend
  # ==========================================================

  frontend:
    build:
      context: ./frontend

    container_name: commuteshare_frontend

    restart: unless-stopped

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    working_dir: /app

    command: npm run dev -- --host

    ports:
      - "5173:5173"

volumes:

  postgres_data: